<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarters Pro Web - TV & VOD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#040712] text-slate-100 h-screen flex flex-col font-sans overflow-hidden select-none">

    <div id="login-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-[#050814] px-4">
        <div class="bg-[#0d1527] border border-slate-800/80 p-8 rounded-2xl shadow-2xl max-w-md w-full space-y-6">
            <div class="text-center">
                <div class="flex items-center justify-center gap-2 mb-2">
                    <i class="fa-solid fa-tv text-xl text-indigo-400"></i>
                    <span class="font-bold text-lg tracking-wider">IPTV<span class="text-indigo-400">SMARTERS</span></span>
                </div>
                <p id="login-status-subtitle" class="text-xs text-slate-400">Acesse usando suas credenciais Xtream API</p>
            </div>

            <form id="login-form" class="space-y-4" onsubmit="handleManualLogin(event)">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Servidor (URL)</label>
                    <input type="text" id="server" required placeholder="http://exemplo.com:8080"
                           class="w-full bg-[#050814] border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500 transition text-slate-200">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Usuário</label>
                    <input type="text" id="username" required placeholder="Seu usuário"
                           class="w-full bg-[#050814] border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500 transition text-slate-200">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="••••••••"
                               class="w-full bg-[#050814] border border-slate-800 rounded-xl pl-4 pr-11 py-2.5 text-sm focus:border-indigo-500 transition text-slate-200">
                        <button type="button" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar senha"
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-indigo-400 transition cursor-pointer">
                            <i id="password-eye-icon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-login"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 text-sm mt-2">
                    <span>Entrar no Servidor</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
            <div id="login-error" class="hidden bg-red-950/60 border border-red-500/40 text-red-200 text-xs p-3 rounded-xl text-left whitespace-pre-line"></div>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden flex-1 flex flex-col justify-between p-6 max-w-7xl mx-auto w-full h-full overflow-y-auto">
        <header class="flex items-center justify-between w-full border-b border-slate-800/40 pb-4">
            <div class="flex items-center gap-6">
                <div class="flex items-baseline font-sans">
                    <span class="text-xl font-light tracking-tight text-white flex items-center gap-1">
                        <i class="fa-solid fa-tv text-indigo-400 text-lg"></i> IPTV<span class="font-black tracking-wide text-white">SMARTERS</span>
                    </span>
                    <span class="text-[10px] font-bold text-indigo-400 ml-1 uppercase">Pro</span>
                </div>
                <div id="dashboard-clock" class="text-xs font-semibold text-slate-400 tracking-wide bg-slate-900/40 px-3 py-1 rounded-full border border-slate-800/30">
                    --:--
                </div>
            </div>

            <div class="flex items-center gap-4 text-slate-300">
                <button type="button" class="flex items-center gap-2 bg-slate-900/40 border border-slate-800/60 px-3 py-1.5 rounded-xl text-xs hover:text-white transition">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
                    <span class="font-medium">Master Search</span>
                </button>
                <button type="button" class="hover:text-white transition w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center"><i class="fa-solid fa-user text-xs"></i></button>
                <button type="button" class="hover:text-white transition w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center"><i class="fa-solid fa-gear text-xs"></i></button>
                
                <button type="button" onclick="logout()" title="Desconectar" 
                        class="flex items-center gap-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 my-auto w-full">
            <button type="button" onclick="openFeature('live')" class="bg-gradient-to-br from-emerald-400 via-cyan-500 to-blue-600 rounded-2xl flex flex-col justify-between overflow-hidden shadow-xl min-h-[300px] cursor-pointer group transition duration-200 text-left border-0">
                <div class="flex-1 flex flex-col items-center justify-center text-white gap-4 w-full">
                    <div class="w-20 h-20 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20 group-hover:scale-110 transition duration-300">
                        <i class="fa-solid fa-desktop text-4xl"></i>
                    </div>
                    <span class="text-2xl font-black tracking-wider drop-shadow-md">TV AO VIVO</span>
                </div>
                <div class="bg-indigo-950/40 backdrop-blur-md border-t border-white/10 px-4 py-2.5 flex items-center justify-between text-white/90 text-[11px] w-full">
                    <span>Ultima atualização: <span class="font-semibold">Agora</span></span>
                    <div class="w-6 h-6 bg-white rounded-md flex items-center justify-center text-slate-900 shadow"><i class="fa-solid fa-arrows-rotate text-[10px]"></i></div>
                </div>
            </button>

            <div class="lg:col-span-2 flex flex-col gap-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <button type="button" onclick="openFeature('vod')" class="bg-gradient-to-br from-rose-500 to-amber-500 rounded-2xl flex flex-col justify-between overflow-hidden shadow-lg min-h-[180px] cursor-pointer group transition duration-200 text-left border-0">
                        <div class="flex-1 flex flex-col items-center justify-center text-white gap-2 w-full">
                            <i class="fa-solid fa-circle-play text-4xl opacity-90 group-hover:scale-110 transition duration-300"></i>
                            <span class="text-xl font-black tracking-wider shadow-sm">FILMES</span>
                        </div>
                        <div class="bg-amber-950/30 backdrop-blur-md border-t border-white/10 px-4 py-2 flex items-center justify-between text-white/90 text-[11px] w-full">
                            <span>Ultima atualização: <span class="font-semibold">Hoje</span></span>
                            <div class="w-6 h-6 bg-white rounded-md flex items-center justify-center text-slate-900 shadow"><i class="fa-solid fa-arrows-rotate text-[10px]"></i></div>
                        </div>
                    </button>

                    <button type="button" onclick="openFeature('series')" class="bg-gradient-to-br from-violet-600 to-sky-400 rounded-2xl flex flex-col justify-between overflow-hidden shadow-lg min-h-[180px] cursor-pointer group transition duration-200 text-left border-0">
                        <div class="flex-1 flex flex-col items-center justify-center text-white gap-2 w-full">
                            <i class="fa-solid fa-clapperboard text-4xl opacity-90 group-hover:scale-110 transition duration-300"></i>
                            <span class="text-xl font-black tracking-wider shadow-sm">SÉRIES</span>
                        </div>
                        <div class="bg-violet-950/30 backdrop-blur-md border-t border-white/10 px-4 py-2 flex items-center justify-between text-white/90 text-[11px] w-full">
                            <span>Ultima atualização: <span class="font-semibold">Hoje</span></span>
                            <div class="w-6 h-6 bg-white rounded-md flex items-center justify-center text-slate-900 shadow"><i class="fa-solid fa-arrows-rotate text-[10px]"></i></div>
                        </div>
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <button type="button" class="bg-[#569b73] p-3.5 rounded-xl flex items-center gap-3 cursor-pointer text-white/90 hover:bg-[#45805e] transition text-left"><i class="fa-solid fa-book-open text-sm"></i><span class="text-xs font-bold uppercase">EPG</span></button>
                    <button type="button" class="bg-[#569b73] p-3.5 rounded-xl flex items-center gap-3 cursor-pointer text-white/90 hover:bg-[#45805e] transition text-left"><i class="fa-solid fa-table-cells-large text-sm"></i><span class="text-xs font-bold uppercase">Multi-Screen</span></button>
                    <button type="button" class="bg-[#569b73] p-3.5 rounded-xl flex items-center gap-3 cursor-pointer text-white/90 hover:bg-[#45805e] transition text-left"><i class="fa-solid fa-clock-rotate-left text-sm"></i><span class="text-xs font-bold uppercase">Alcançar</span></button>
                </div>
            </div>
        </div>

        <footer class="flex items-center justify-between w-full border-t border-slate-800/40 pt-4 text-xs font-medium text-slate-500">
            <div id="info-expiration">Expiração: Verificando...</div>
            <div id="info-username">Conectado: ---</div>
        </footer>
    </div>

    <div id="inner-app-screen" class="hidden absolute inset-0 w-full h-full z-10 flex overflow-hidden bg-black">
        <div id="player-container" class="absolute inset-0 w-full h-full z-0 bg-black" onclick="handleVideoAreaClick()">
            <div id="player-wrapper" class="w-full h-full absolute inset-0"></div>
            <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-600 gap-3 bg-[#050814]">
                <i class="fa-solid fa-play text-5xl opacity-30 animate-pulse text-indigo-500"></i>
                <p class="text-xs font-bold uppercase tracking-widest text-slate-500">Selecione um canal ou filme para reproduzir</p>
            </div>
        </div>

        <div id="menu-overlay" class="absolute inset-y-0 left-0 w-full md:w-[70%] lg:w-[60%] xl:w-[50%] z-10 bg-slate-950/90 backdrop-blur-md flex flex-col border-r border-slate-800/40 transition-all duration-300">
            <div class="p-4 flex items-center gap-4 border-b border-smarters-line shrink-0">
                <button type="button" onclick="backToDashboard()" class="w-9 h-9 bg-[#3b3cb4] hover:bg-[#32339c] text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95 shrink-0">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </button>
                <div>
                    <h1 id="inner-view-title" class="font-black text-base tracking-wide text-white">Catálogo</h1>
                    <p id="inner-view-subtitle" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Navegação Direta</p>
                </div>
                
                <div class="ml-auto relative w-40 sm:w-48">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-[10px]"></i>
                    <input type="text" id="search-channel" placeholder="Buscar..." onkeyup="filterChannels()"
                           class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-7 pr-2 py-1.5 text-xs focus:border-cyan-600 text-slate-200">
                </div>
            </div>

            <div class="flex-1 flex overflow-hidden">
                <div id="categories-list" class="w-[40%] border-r border-smarters-line overflow-y-auto bg-black/20 flex flex-col divide-y divide-white/[0.04]"></div>
                <div id="channels-grid-container" class="w-[60%] overflow-y-auto bg-black/10 flex flex-col">
                    <div id="channels-grid"></div>
                </div>
            </div>
        </div>

        <div class="absolute top-4 right-4 z-20 flex items-center gap-2">
            <button type="button" onclick="toggleMenuOverlay()" id="btn-toggle-menu" class="bg-slate-900/90 hover:bg-indigo-600 border border-slate-700/60 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-2xl transition">
                <i class="fa-solid fa-expand"></i>
                <span id="txt-toggle-menu">Ocultar Menu</span>
            </button>
        </div>
    </div>

    <div id="series-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-[#0c1222] border border-slate-800 w-full max-w-3xl h-[75vh] rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/40 shrink-0">
                <h3 id="modal-series-title" class="font-black text-sm text-white truncate max-w-md">Série</h3>
                <button type="button" onclick="closeSeriesModal()" class="text-slate-400 hover:text-white bg-slate-800 w-7 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            <div class="flex-1 flex overflow-hidden">
                <div class="w-44 border-r border-slate-800 bg-slate-950/20 overflow-y-auto p-2 space-y-1" id="modal-seasons-box"></div>
                <div class="flex-1 overflow-y-auto p-3 space-y-1.5 bg-[#080d1a]" id="modal-episodes-box"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
