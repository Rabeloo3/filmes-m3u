<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabelo IPTV - TV & VOD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        @keyframes cinematicPulse {
            0%, 100% { transform: scale(0.98); opacity: 0.85; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.2)); }
            50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.6)); }
        }
        .animate-cinematic { animation: cinematicPulse 2.5s infinite ease-in-out; }
        .fade-out { opacity: 0; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
    </style>
</head>
<body class="bg-[#040712] text-slate-100 h-screen flex flex-col font-sans overflow-hidden select-none">

    <div id="loading-screen" class="hidden absolute inset-0 z-[100] flex flex-col items-center justify-center bg-[#050814] opacity-100">
        <div class="flex items-center justify-center gap-5 animate-cinematic mb-12">
            <i class="fa-solid fa-tv text-6xl md:text-8xl text-indigo-500"></i>
            <h1 class="text-6xl md:text-8xl font-black text-white tracking-widest">RABELO <span class="text-indigo-500">IPTV</span></h1>
        </div>
        <div class="w-64 flex flex-col items-center">
            <p id="loading-text" class="text-indigo-400 text-[11px] font-bold uppercase tracking-widest flex items-center gap-2 mb-3 h-4 transition-all duration-300">A iniciar sistema...</p>
            <div class="w-full h-[3px] bg-slate-800/80 rounded-full overflow-hidden">
                <div id="loading-bar" class="h-full w-0 bg-gradient-to-r from-indigo-500 to-cyan-400 transition-all duration-100 ease-out"></div>
            </div>
        </div>
    </div>

    <div id="login-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-[#050814] px-4">
        <div class="bg-[#0d1527] border border-slate-800/80 p-8 rounded-2xl shadow-2xl max-w-md w-full space-y-6">
            <div class="text-center">
                <div class="flex items-center justify-center gap-2 mb-2">
                    <i class="fa-solid fa-tv text-xl text-indigo-400"></i>
                    <span class="font-bold text-lg tracking-wider">RABELO <span class="text-indigo-400">IPTV</span></span>
                </div>
                <p class="text-xs text-slate-400">Acesse usando suas credenciais Xtream API</p>
            </div>
            <form id="login-form" class="space-y-4" onsubmit="handleManualLogin(event)">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Servidor (URL)</label>
                    <input type="text" id="server" required placeholder="http://exemplo.com:8080" class="w-full bg-[#050814] border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500 transition text-slate-200">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Usuário</label>
                    <input type="text" id="username" required placeholder="Seu usuário" class="w-full bg-[#050814] border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500 transition text-slate-200">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-[#050814] border border-slate-800 rounded-xl pl-4 pr-11 py-2.5 text-sm focus:border-indigo-500 transition text-slate-200">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-indigo-400 transition cursor-pointer">
                            <i id="password-eye-icon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 text-sm mt-2">
                    <span>Entrar no Servidor</span> <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
            <div id="login-error" class="hidden bg-red-950/60 border border-red-500/40 text-red-200 text-xs p-3 rounded-xl text-left whitespace-pre-line"></div>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden flex-1 flex flex-col justify-between p-6 max-w-7xl mx-auto w-full h-full overflow-y-auto">
        <header class="flex items-center justify-between w-full border-b border-slate-800/40 pb-4">
            <div class="flex items-center gap-6">
                <div class="flex items-baseline font-sans">
                    <span class="text-xl font-light tracking-tight text-white flex items-center gap-1">
                        <i class="fa-solid fa-tv text-indigo-400 text-lg"></i> RABELO <span class="font-black tracking-wide text-white">IPTV</span>
                    </span>
                    <span class="text-[10px] font-bold text-indigo-400 ml-1 uppercase">Pro</span>
                </div>
                <div id="dashboard-clock" class="text-xs font-semibold text-slate-400 tracking-wide bg-slate-900/40 px-3 py-1 rounded-full border border-slate-800/30">--:--</div>
            </div>
            <div class="flex items-center gap-4 text-slate-300">
                <button type="button" onclick="logout()" class="flex items-center gap-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-right-from-bracket"></i> <span>Sair</span>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 my-auto w-full">
            <button type="button" onclick="openFeature('live')" class="bg-gradient-to-br from-emerald-400 via-cyan-500 to-blue-600 rounded-2xl flex flex-col justify-between overflow-hidden shadow-xl min-h-[300px] cursor-pointer group transition duration-200 text-left border-0">
                <div class="flex-1 flex flex-col items-center justify-center text-white gap-4 w-full">
                    <div class="w-20 h-20 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20 group-hover:scale-110 transition duration-300"><i class="fa-solid fa-desktop text-4xl"></i></div>
                    <span class="text-2xl font-black tracking-wider drop-shadow-md">TV AO VIVO</span>
                </div>
            </button>
            <div class="lg:col-span-2 flex flex-col gap-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <button type="button" onclick="openFeature('vod')" class="bg-gradient-to-br from-rose-500 to-amber-500 rounded-2xl flex flex-col justify-between overflow-hidden shadow-lg min-h-[180px] cursor-pointer group transition duration-200 text-left border-0">
                        <div class="flex-1 flex flex-col items-center justify-center text-white gap-2 w-full">
                            <i class="fa-solid fa-circle-play text-4xl opacity-90 group-hover:scale-110 transition duration-300"></i>
                            <span class="text-xl font-black tracking-wider shadow-sm">FILMES</span>
                        </div>
                    </button>
                    <button type="button" onclick="openFeature('series')" class="bg-gradient-to-br from-violet-600 to-sky-400 rounded-2xl flex flex-col justify-between overflow-hidden shadow-lg min-h-[180px] cursor-pointer group transition duration-200 text-left border-0">
                        <div class="flex-1 flex flex-col items-center justify-center text-white gap-2 w-full">
                            <i class="fa-solid fa-clapperboard text-4xl opacity-90 group-hover:scale-110 transition duration-300"></i>
                            <span class="text-xl font-black tracking-wider shadow-sm">SÉRIES</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <footer class="flex items-center justify-between w-full border-t border-slate-800/40 pt-4 text-xs font-medium text-slate-500">
            <div id="info-expiration">Expiração: Verificando...</div>
            <div id="info-username">Conectado: ---</div>
        </footer>
    </div>

    <div id="inner-app-screen" class="hidden absolute inset-0 w-full h-full z-10 flex overflow-hidden bg-black">
        
        <div id="player-container" class="absolute inset-0 w-full h-full z-0 bg-black">
            <div id="player-wrapper" class="w-full h-full absolute inset-0"></div>
            <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-600 gap-3 bg-[#050814]">
                <i class="fa-solid fa-play text-5xl opacity-30 animate-pulse text-indigo-500"></i>
                <p class="text-xs font-bold uppercase tracking-widest text-slate-500">Selecione um conteúdo para reproduzir</p>
            </div>
        </div>

        <div id="btn-back-player" class="hidden absolute top-6 left-6 z-[60]">
            <button type="button" onclick="exitPlayerMode()" class="w-12 h-12 bg-slate-900/80 border border-white/10 hover:bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-2xl backdrop-blur-md transition-all">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </button>
        </div>

        <div id="navigation-container" class="absolute inset-0 z-10 bg-[#050814] w-full h-full">
            
            <div id="view-categories" class="nav-view w-full h-full flex flex-col p-6 overflow-y-auto hidden">
                <div class="flex items-center gap-4 mb-8 shrink-0">
                    <button type="button" onclick="backToDashboard()" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-white rounded-full flex items-center justify-center shadow-lg transition-transform focus:ring-2 focus:ring-cyan-500 shrink-0">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h1 id="categories-title" class="text-2xl font-black text-white uppercase tracking-wider">Categorias</h1>
                </div>
                <div id="categories-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 pb-12"></div>
            </div>

            <div id="view-grid" class="nav-view w-full h-full flex flex-col overflow-y-auto bg-[#050814] hidden">
                <div class="flex flex-col md:flex-row md:items-center gap-4 p-6 sticky top-0 bg-[#050814]/95 backdrop-blur-md z-20 shrink-0 border-b border-white/5">
                    <div class="flex items-center gap-4">
                        <button type="button" onclick="showViewCategories()" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-white rounded-full flex items-center justify-center shadow-lg transition-transform focus:ring-2 focus:ring-cyan-500 shrink-0">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <h1 id="grid-title" class="text-xl font-bold text-white tracking-wide truncate max-w-[200px] md:max-w-md">Catálogo</h1>
                    </div>
                    <div class="ml-auto relative w-full md:w-64 shrink-0">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-sm"></i>
                        <input type="text" id="search-channel" placeholder="Buscar..." onkeyup="filterChannels()" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-sm focus:border-cyan-600 text-slate-200 transition">
                    </div>
                </div>
                <div id="channels-grid" class="p-6 pt-2 pb-12"></div>
            </div>

            <div id="view-details" class="nav-view w-full h-full relative overflow-y-auto bg-[#050814] hidden">
                <div id="details-bg" class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-30 blur-md fixed transition-all duration-700"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#050814] via-[#050814]/90 to-[#050814]/40 fixed pointer-events-none"></div>
                
                <div class="relative z-10 flex flex-col p-6 md:p-12 min-h-full">
                    <button type="button" onclick="showViewGrid()" class="w-10 h-10 bg-slate-800/80 hover:bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-2xl backdrop-blur-md transition-transform focus:ring-2 focus:ring-cyan-500 shrink-0 mb-8 md:mb-12">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    
                    <div class="flex flex-col md:flex-row gap-8 items-start mt-auto">
                        <img id="details-poster" src="" class="w-48 md:w-72 rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.8)] border border-white/10 shrink-0 hidden md:block">
                        <div class="flex flex-col gap-4 text-white w-full">
                            <h1 id="details-title" class="text-4xl md:text-6xl font-black tracking-wide text-white drop-shadow-2xl">Carregando...</h1>
                            <div id="details-meta" class="flex flex-wrap items-center gap-3 text-xs md:text-sm font-bold text-cyan-400 uppercase tracking-wider drop-shadow-md">
                                </div>
                            <p id="details-desc" class="text-slate-300 text-sm md:text-base leading-relaxed max-w-4xl drop-shadow-md mt-2">...</p>
                            
                            <div id="details-actions" class="mt-6 flex flex-col gap-4 w-full max-w-4xl"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
